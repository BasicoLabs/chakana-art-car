<svg xmlns="http://www.w3.org/2000/svg" width="1189" height="841" viewBox="0 0 1189 841"><style>text{font-family:Verdana;fill:#132433}.t{font-size:28px}.h{font-size:18px;font-weight:bold}.s{font-size:13px}.wood{fill:#dba96c55;stroke:#9c5d2d;stroke-width:4}.metal{fill:#62717c55;stroke:#42515d;stroke-width:3}.safe{fill:#c75e4b22;stroke:#c75e4b;stroke-width:2;stroke-dasharray:8 6}.line{stroke:#132433;stroke-width:3}</style><rect width="1189" height="841" fill="#fcfaf6"/><rect x="35" y="30" width="1119" height="56" rx="4" fill="#071624"/><text x="55" y="67" class="t" fill="white">PM-003 · UNIÓN REPETIBLE Y SECUENCIA DE MONTAJE</text><text x="55" y="108" class="s">DETALLE CONCEPTUAL · DIMENSIONAR PLACAS, BULONES, ARRANCAMIENTO Y APLASTAMIENTO ANTES DE LIBERAR</text><text x="55" y="155" class="h">UNIÓN ENTRE MÓDULOS</text><rect x="100" y="230" width="190" height="400" class="wood"/><rect x="420" y="230" width="190" height="400" class="wood"/><rect x="245" y="335" width="220" height="190" rx="10" class="metal"/><circle cx="285" cy="385" r="15" fill="#071624"/><circle cx="425" cy="385" r="15" fill="#071624"/><circle cx="285" cy="475" r="15" fill="#071624"/><circle cx="425" cy="475" r="15" fill="#071624"/><text x="110" y="680" class="s">Bastidor de referencia 45×70 mm + fenólico 9-12 mm.</text><text x="110" y="708" class="s">Placas en ambas caras, bulones M10/M12, arandelas anchas y tuerca autofrenante.</text><text x="110" y="736" class="s">No tomar cargas sólo con tornillos sobre el canto del fenólico.</text><text x="700" y="155" class="h">SECUENCIA</text><text x="700" y="205" class="h">01 · replantear y nivelar bases</text><text x="700" y="250" class="h">02 · montar módulo central</text><text x="700" y="295" class="h">03 · colocar diagonales temporales</text><text x="700" y="340" class="h">04 · sumar módulos simétricamente</text><text x="700" y="385" class="h">05 · placas, bulones y testigos</text><text x="700" y="430" class="h">06 · outriggers, lastre y verificación</text><text x="700" y="475" class="h">07 · mesa DJ y cierre</text><text x="700" y="520" class="h">08 · LED/PA y cableado protegido</text><text x="700" y="565" class="h">09 · inspección independiente</text><text x="700" y="610" class="h">10 · habilitar público</text><rect x="690" y="665" width="440" height="100" rx="8" class="safe"/><text x="715" y="700" class="h">STOP</text><text x="715" y="730" class="s">No trabajar bajo módulos sin puntal; no montar con viento;</text><text x="715" y="752" class="s">cerrar perímetro hasta completar inspección y reapriete.</text></svg>

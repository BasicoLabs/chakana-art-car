<text x="55" y="155" class="h">PLANTA</text><rect x="120" y="245" width="650" height="260" rx="15" class="wood"/><rect x="180" y="300" width="530" height="150" class="tech"/><path d="M120 245 55 175M770 245 835 175M120 505 55 575M770 505 835 575" class="line"/><rect x="30" y="145" width="90" height="60" class="wood"/><rect x="790" y="145" width="90" height="60" class="wood"/><rect x="30" y="545" width="90" height="60" class="wood"/><rect x="790" y="545" width="90" height="60" class="wood"/><text x="275" y="382" class="h">PROFUNDIDAD 1000-1400 PROY</text><text x="55" y="650" class="s">Cuatro patas regulables sobre placas + cuatro outriggers/lastres.</text><text x="55" y="674" class="s">No usar estacas sin autorización y estudio del terreno.</text>

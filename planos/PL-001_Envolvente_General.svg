 <text x="745" y="550" class="n">CONDICIONES DE DISEÑO</text><text x="745" y="585" class="s">1. Sólo piloto sentado durante la marcha.</text><text x="745" y="612" class="s">2. Fachada DJ cerrada y asegurada en marcha.</text><text x="745" y="639" class="s">3. DJ de pie únicamente con freno, calzos e inhibición.</text><text x="745" y="666" class="s">4. Generador apagado en marcha y operando en tierra.</text><text x="745" y="693" class="s">5. Masa de fachada por encima de 1,5 m: objetivo ≤65 kg.</text><text x="745" y="720" class="s">6. Altura final se congela después de medir estabilidad.</text><rect x="735" y="745" width="390" height="55" rx="8" class="safe"/><text x="755" y="778" class="n">NO ES PLANO LIBERADO PARA FABRICACIÓN</text>
